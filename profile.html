<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | SkillSwap Hub</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/profile.js" defer></script>
</head>

<body>

    <main class="profile-container">

        <a href="index.html" class="signup-logo">SkillSwap Hub</a>

        <h1>My Skills Profile</h1>

        <p class="profile-description">
            Here's what you can teach and what you want to learn.
        </p>

        <div class="profile-card">
            <h2>Skills I Can Teach</h2>
            <ul id="teachList"></ul>
        </div>

        <div class="profile-card">
            <h2>Skills I Want to Learn</h2>
            <ul id="learnList"></ul>
        </div>

        <p id="profileMessage"></p>

        <a href="exchange.html" class="btnprimary profile-edit-button">
            Edit My Skills
        </a>
        <a href="matches.html" class="btnprimary profile-edit-button">
            Find Skill Matches
        </a>

    </main>

</body>
</html>
