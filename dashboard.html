<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | SkillSwap Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="profile-container">
        <div class="profile-card">
            <h1>My Dashboard</h1>
            <p>Welcome to your SkillSwap Hub dashboard!</p>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <h2 id="teachCount">0</h2>
                    <p>Skills I Teach</p>
                </div>

                <div class="stat-card">
                    <h2 id="learnCount">0</h2>
                    <p>Skills I Want to Learn</p>
                </div>

                <div class="stat-card">
                    <h2 id="requestCount">0</h2>
                    <p>Connection Requests</p>
                </div>

                <div class="stat-card">
                    <h2 id="acceptedCount">0</h2>
                    <p>Accepted Connections</p>
                </div>
            </div>

            <div class="dashboard-links">
                <a href="profile.html" class="btnprimary">My Profile</a>
                <a href="exchange.html" class="btnprimary">Edit Skills</a>
                <a href="matches.html" class="btnprimary">Find Matches</a>
                <a href="connections.html" class="btnprimary">My Connections</a>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>

</body>
</html>
