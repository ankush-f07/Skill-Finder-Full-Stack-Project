<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | SkillSwap Hub</title>

    <link rel="stylesheet" href="css/style.css">
    <script src="js/signup.js" defer></script>
</head>

<body>

    <main class="container">

        <div class="signup-card">

            <a href="index.html" class="signup-logo">
                SkillSwap Hub
            </a>

            <h1>Create your account</h1>

            <p class="signup-description">
                Join our community and start exchanging skills.
            </p>

            <form id="signupForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                    
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                   
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >

                   
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Enter your password again"
                        required
                    >

                 
                </div>

                <button type="submit" class="btnprimary signup-button">
                    Create Account
                </button>

                <p id="formMessage" role="status"></p>

            </form>

            <p class="login-prompt">
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

    </main>

</body>
</html>
